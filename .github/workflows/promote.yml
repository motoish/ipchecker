name: Promote stable release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Immutable build tag, for example v2026.8.17-a1b2c3d4
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    name: Promote monthly stable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          mkdir promoted
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ipchecker.zip' \
            --pattern 'update.json' \
            --dir promoted

      - name: Verify immutable assets
        run: |
          set -euo pipefail
          test -s promoted/ipchecker.zip
          test -s promoted/update.json
          bash scripts/verify-app-archive.sh promoted/ipchecker.zip
          jq -e '
            type == "object" and
            (.version | type == "string") and
            (.build | type == "number" and . > 0) and
            (.size | type == "number" and . > 0) and
            (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
            (.url | type == "string" and startswith("https://github.com/"))
          ' promoted/update.json >/dev/null
          expected_size=$(jq -r '.size' promoted/update.json)
          actual_size=$(wc -c < promoted/ipchecker.zip | tr -d ' ')
          expected_sha=$(jq -r '.sha256' promoted/update.json)
          actual_sha=$(sha256sum promoted/ipchecker.zip | cut -d ' ' -f 1)
          if [[ "$actual_size" != "$expected_size" || "$actual_sha" != "$expected_sha" ]]; then
            echo "Immutable assets do not match update.json" >&2
            exit 1
          fi

      - name: Promote monthly stable release
        id: calver
        uses: motoish/calver-release-action@v1
        with:
          mode: promote
          source_tag: ${{ inputs.source_tag }}
          token: ${{ github.token }}

      - name: Resolve stable release notes range
        id: stable_range
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          source_commit=$(git rev-list -n 1 "$SOURCE_TAG")
          previous_stable=$(git tag --merged "$source_commit^" --sort=-version:refname \
            | grep -E '^v20[0-9]{2}\.([1-9]|1[0-2])$' \
            | head -n 1 || true)
          if [[ -n "$previous_stable" ]]; then
            range="$previous_stable..$source_commit"
          else
            range="$source_commit"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Generate stable release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --ignore-tags '.*' --tag ${{ steps.calver.outputs.channel_tag }} ${{ steps.stable_range.outputs.range }}
        env:
          OUTPUT: promoted/release-notes.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify stable release notes scope
        env:
          STABLE_TAG: ${{ steps.calver.outputs.channel_tag }}
        run: |
          set -euo pipefail
          test -s promoted/release-notes.md
          section_count=$(grep -c '^## ' promoted/release-notes.md || true)
          expected_heading="## ${STABLE_TAG#v}"
          if [[ "$section_count" != "1" ]] || ! grep -Fqx "$expected_heading" promoted/release-notes.md; then
            echo "Stable release notes must contain exactly the $expected_heading section" >&2
            exit 1
          fi

      - name: Update stable release notes
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ steps.calver.outputs.channel_tag }}
        run: |
          gh release edit "$STABLE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file promoted/release-notes.md

      - name: Upload stable assets
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ steps.calver.outputs.channel_tag }}
        run: |
          gh release upload "$STABLE_TAG" \
            promoted/ipchecker.zip \
            promoted/update.json \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify stable assets
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ steps.calver.outputs.channel_tag }}
        run: |
          set -euo pipefail
          verified=$(gh release view "$STABLE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[] | select((.name == "ipchecker.zip" or .name == "update.json") and .size > 0)] | length == 2')
          if [[ "$verified" != "true" ]]; then
            echo "Stable release $STABLE_TAG is missing ipchecker.zip or update.json" >&2
            exit 1
          fi
