name: Bump version
description: Set today's CalVer, commit version files, and push the git tag

outputs:
  version:
    description: Cargo package version
    value: ${{ steps.bump.outputs.version }}
  tag:
    description: Git tag including the v prefix
    value: ${{ steps.bump.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Fetch tags
      shell: bash
      run: git fetch --force --tags origin

    - name: Bump version files
      id: bump
      shell: bash
      run: ./scripts/bump-version.sh

    - name: Commit version bump
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock resources/Info.plist
        if git diff --staged --quiet; then
          echo "No version file changes; refusing to tag" >&2
          exit 1
        fi
        git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
        git push origin HEAD:main

    - name: Create and push tag
      shell: bash
      run: |
        set -euo pipefail
        tag="${{ steps.bump.outputs.tag }}"
        if git rev-parse "$tag" >/dev/null 2>&1; then
          echo "Tag $tag already exists" >&2
          exit 1
        fi
        git tag "$tag"
        git push origin "$tag"
