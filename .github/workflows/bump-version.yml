name: Bump version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    name: Bump, commit, and tag
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Bump version files
        id: bump
        run: ./scripts/bump-version.sh

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml resources/Info.plist
          if git diff --staged --quiet; then
            echo "No version file changes; refusing to tag" >&2
            exit 1
          fi
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Create and push tag
        run: |
          set -euo pipefail
          tag="${{ steps.bump.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"

  release:
    name: Release
    needs: bump
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
    secrets: inherit
