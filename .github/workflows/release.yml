name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name including the v prefix (for example v2026.8.16)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Tag name including the v prefix (for example v2026.8.16)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          tag="${tag#v}"
          cargo_version="$(grep -E '^version[[:space:]]*=' Cargo.toml | head -n1 | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          if [[ -z "$cargo_version" ]]; then
            echo "version not found in Cargo.toml" >&2
            exit 1
          fi
          if [[ "$tag" != "$cargo_version" ]]; then
            echo "Tag v$tag does not match Cargo.toml version $cargo_version" >&2
            echo "Push to main so the release workflow can bump and tag first." >&2
            exit 1
          fi

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: CHANGES.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C main origin/main

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit and push CHANGELOG.md
        run: |
          set -euo pipefail
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "CHANGELOG.md already up to date"
            exit 0
          fi
          git commit -m "chore(release): update CHANGELOG.md for ${{ steps.meta.outputs.tag }} [skip ci]"
          git push origin main
