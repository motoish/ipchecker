name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Format, lint, and test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

  release:
    name: Release
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: "false"

      - name: Compute CalVer identity
        id: identity
        run: bash scripts/calver-identity.sh Asia/Tokyo "$GITHUB_SHA" "$(date +%s)"

      - name: Prepare app version
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          build=$(bash scripts/commit-count.sh)
          bash scripts/prepare-release-version.sh "$VERSION" "$build"

      - name: Bundle app
        run: bash scripts/bundle-local.sh

      - name: Zip app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            target/release/bundle/ipchecker.app \
            ipchecker.zip

      - name: Generate update manifest
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          BUILD_TAG: ${{ steps.identity.outputs.build_tag }}
        run: |
          set -euo pipefail
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' resources/Info.plist)
          bash scripts/generate-update-manifest.sh \
            ipchecker.zip \
            "$VERSION" \
            "$build" \
            "$BUILD_TAG" \
            "${{ github.repository }}" \
            update.json

      - name: Publish CalVer release records
        id: calver
        uses: motoish/calver-release-action@v1
        with:
          mode: daily
          timezone: Asia/Tokyo
          now: ${{ steps.identity.outputs.epoch }}
          expected_version: ${{ steps.identity.outputs.version }}
          token: ${{ github.token }}

      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ steps.calver.outputs.build_tag }}
        run: |
          gh release upload "$BUILD_TAG" \
            ipchecker.zip \
            update.json \
            --clobber

      - name: Save Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
