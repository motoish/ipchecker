name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Format, lint, and test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

  release:
    name: Release
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message || '', 'chore(release):') }}
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: "false"

      - name: Compute CalVer identity
        id: identity
        run: bash scripts/calver-identity.sh Asia/Tokyo "$GITHUB_SHA" "$(date +%s)"

      - name: Prepare app version
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          build=$(bash scripts/commit-count.sh)
          bash scripts/prepare-release-version.sh "$VERSION" "$build"

      - name: Bundle app
        run: bash scripts/bundle-local.sh

      - name: Zip app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            target/release/bundle/ipchecker.app \
            ipchecker.zip

      - name: Verify app archive
        run: bash scripts/verify-app-archive.sh ipchecker.zip

      - name: Generate update manifest
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          BUILD_TAG: ${{ steps.identity.outputs.build_tag }}
        run: |
          set -euo pipefail
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' resources/Info.plist)
          bash scripts/generate-update-manifest.sh \
            ipchecker.zip \
            "$VERSION" \
            "$build" \
            "$BUILD_TAG" \
            "${{ github.repository }}" \
            update.json

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.identity.outputs.build_tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve release notes range
        id: release_range
        run: |
          set -euo pipefail
          previous_tag=$(git describe --tags \
            --match 'v[0-9]*.[0-9]*.[0-9]*-????????' \
            --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.identity.outputs.build_tag }} ${{ steps.release_range.outputs.range }}
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify release notes scope
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          test -s release-notes.md
          section_count=$(grep -c '^## ' release-notes.md || true)
          if [[ "$section_count" != "1" ]] || ! grep -Fqx "## $VERSION" release-notes.md; then
            echo "release notes must contain exactly the current version section" >&2
            exit 1
          fi

      - name: Commit release metadata
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: bash scripts/commit-release-metadata.sh "$VERSION" "$EXPECTED_HEAD"

      - name: Publish CalVer release records
        id: calver
        uses: motoish/calver-release-action@v1
        with:
          mode: daily
          timezone: Asia/Tokyo
          now: ${{ steps.identity.outputs.epoch }}
          expected_version: ${{ steps.identity.outputs.version }}
          token: ${{ github.token }}

      - name: Update immutable release notes
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ steps.calver.outputs.build_tag }}
        run: |
          gh release edit "$BUILD_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md

      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ steps.calver.outputs.build_tag }}
        run: |
          gh release upload "$BUILD_TAG" \
            ipchecker.zip \
            update.json \
            --clobber
