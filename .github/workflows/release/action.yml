name: Release
description: Create the unique pre-release and update the daily stable GitHub Release

inputs:
  tag:
    description: Unique git tag including the v prefix
    required: true
  stable_tag:
    description: Moving daily stable tag including the v prefix
    required: true

runs:
  using: composite
  steps:
    - name: Generate release notes
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
        args: --latest --strip header
      env:
        OUTPUT: CHANGES.md
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Create unique GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ inputs.tag }}
        body_path: CHANGES.md
        generate_release_notes: false
        prerelease: true
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Update daily stable GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.stable_tag }}
        name: ${{ inputs.stable_tag }}
        body_path: CHANGES.md
        generate_release_notes: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
