name: Release
description: Create the unique pre-release and update the daily stable GitHub Release

inputs:
  tag:
    description: Unique git tag including the v prefix
    required: true
  stable_tag:
    description: Moving daily stable tag including the v prefix
    required: true
  asset:
    description: Path to the zipped .app for this version
    required: true

runs:
  using: composite
  steps:
    - name: Generate release notes
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
        args: --latest --strip header
      env:
        OUTPUT: CHANGES.md
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Create unique GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ inputs.tag }}
        body_path: CHANGES.md
        files: ${{ inputs.asset }}
        fail_on_unmatched_files: true
        generate_release_notes: false
        prerelease: true
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Stage stable app zip
      shell: bash
      run: cp "${{ inputs.asset }}" ipchecker.zip

    - name: Generate update manifest
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.tag }}"
        version="${version#v}"
        build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' resources/Info.plist)
        bash scripts/generate-update-manifest.sh \
          "${{ inputs.asset }}" \
          "$version" \
          "$build" \
          "${{ inputs.tag }}" \
          "${{ github.repository }}" \
          update.json

    - name: Replace previous stable assets
      shell: bash
      run: |
        set -euo pipefail
        if gh release view "${{ inputs.stable_tag }}" >/dev/null 2>&1; then
          for asset in ipchecker.zip update.json; do
            gh release delete-asset "${{ inputs.stable_tag }}" "$asset" --yes || true
          done
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Update daily stable GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.stable_tag }}
        name: ${{ inputs.stable_tag }}
        body_path: CHANGES.md
        files: |
          ipchecker.zip
          update.json
        fail_on_unmatched_files: true
        generate_release_notes: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
