[package]
name = "ipchecker"
version = "2026.8.26-92e7d097"
edition = "2024"
rust-version = "1.90"
license = "BSD-3-Clause"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
dirs = "6"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tray-icon = { version = "0.24.2", default-features = false }
muda = { version = "0.19.3", default-features = false }
tao = { version = "0.36.0", default-features = false }
arboard = { version = "3.6.1", default-features = false }
log = "0.4.33"
env_logger = "0.11.11"
rust-i18n = "3"
libc = "0.2"
sys-locale = "0.3"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSAttributedString", "NSBezierPath", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageView", "NSPanel", "NSParagraphStyle", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSStringDrawing", "NSText", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSData", "NSDate", "NSDateFormatter", "NSDictionary", "NSFormatter", "NSGeometry", "NSNotification", "NSObject", "NSRelativeDateTimeFormatter", "NSString", "NSValue"] }

[dev-dependencies]
plist = "1"
