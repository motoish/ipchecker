[package]
name = "ipchecker"
version = "2026.9.2-52ef6923"
edition = "2024"
rust-version = "1.90"
license = "BSD-3-Clause"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "0.9.12"
dirs = "6"
thiserror = "2.0.20"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-tls"] }
tray-icon = { version = "0.24.2", default-features = false }
muda = { version = "0.19.3", default-features = false }
tao = { version = "0.37.0", default-features = false }
arboard = { version = "3.6.1", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
csv = "1.4.0"
log = "0.4.34"
env_logger = "0.11.11"
rust-i18n = "3.1.5"
libc = "0.2.189"
sys-locale = "0.3.2"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSAttributedString", "NSBezierPath", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageView", "NSOpenPanel", "NSPanel", "NSParagraphStyle", "NSResponder", "NSSavePanel", "NSStatusBarButton", "NSStatusItem", "NSStringDrawing", "NSText", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSData", "NSDate", "NSDateFormatter", "NSDictionary", "NSFormatter", "NSGeometry", "NSNotification", "NSObject", "NSRelativeDateTimeFormatter", "NSString", "NSURL", "NSValue"] }

[dev-dependencies]
plist = "1.10.0"
